[package]
name = "dbdelve"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "A native SQL client"
publish = false

# Exact pins: gpui is pre-1.0 and breaks on minor bumps. See AGENTS.md before
# touching these, and commit Cargo.lock with any change.
#
# `gpui-pre` rather than `gpui`: the `gpui` crate is a one-off October 2025
# snapshot the Zed team has not republished since, while `gpui-pre` is a rolling
# republish of zed main. gpui-component depends on it under the name `gpui`, so
# taking it here is what keeps one copy of the framework in the graph.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.5" }
gpui-component = { version = "=0.6.4", features = ["tree-sitter-sql"] }

# gpui-component keeps its parse tree private, so we run our own parser to find
# statement boundaries. Versions match what gpui-component pulls, to avoid
# linking two copies of tree-sitter.
#
# Pinned exactly, for the same reason gpui is. The grammar decides where every
# statement boundary falls and which statements `sql.rs` refuses to splice into,
# so a bump changes what DBDelve sends to the server. It is a correctness
# dependency, not a formatting one.
tree-sitter = "=0.26.13"
tree-sitter-sequel = "=0.3.11"

# The vocabulary gpui-component's completion provider speaks, and nothing more:
# no language server is started, and none could be -- the completions come from
# the catalog DBDelve already loaded. The library re-exports `Position` but not
# `CompletionItem`, so this is a direct dependency on a crate already in the
# graph. Pinned exactly to the version gpui-component resolves, so the trait we
# implement and the types we hand it are the same crate rather than two copies.
lsp-types = "=0.97.0"

# Blocking client, deliberately. GPUI's executor is async-task over Grand
# Central Dispatch with no reactor, so a tokio future panics on it. This owns
# its runtime and runs on the background executor. See AGENTS.md.
postgres = "0.19"

# SQLite. Blocking like the Postgres driver, and for the same reason.
#
# `bundled` compiles the amalgamation instead of linking whatever libsqlite3
# macOS shipped, so the version and the compile-time options are DBDelve's rather
# than the OS release's. `column_metadata` is what makes in-grid editing
# reachable at all: it is the only way to learn that a result column is
# `accounts.id` and not an expression. `column_decltype` is the type tag.
#
# `default-features = false` is load-bearing here too: 0.40's defaults pull in
# `ffi-sqlite-wasm-rs`, a WASM backend with no business in a native build.
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled",
    "column_metadata",
    "column_decltype",
] }

# MySQL. Blocking, and with no tokio anywhere in its tree -- rust-mysql-simple
# is the sibling of the blocking `postgres` client, not of `mysql_async`.
#
# `rustls-tls-ring` rather than `rustls-tls`: the latter selects the aws-lc-rs
# provider, which is the same second-crypto-library hazard documented on
# `rustls` below. `minimal-rust` takes flate2's pure-Rust backend over zlib for
# the same reason -- no C built for something already solved in the graph.
#
# It verifies certificates itself, against webpki-roots rather than the
# Keychain the Postgres path reads. That divergence is deliberate and recorded
# in the multi-engine spec, section 4.3: it fails loudly rather than quietly
# accepting less than the sslmode asked for.
mysql = { version = "28", default-features = false, features = [
    "minimal-rust",
    "buffer-pool",
    "rustls-tls-ring",
] }

# PostGIS sends geometry through the simple query protocol as hex EWKB. Decode
# that server value at the database boundary so the UI still receives strings,
# but receives readable WKT rather than binary rendered as hexadecimal.
geozero = { version = "=0.15.1", default-features = false, features = ["with-wkb"] }
hex = "=0.4.3"

# TLS. The driver ships none of its own -- `Client::connect` takes a connector,
# and `NoTls` is a real type that refuses -- so this is what makes `sslmode`
# something DBDelve can honour rather than something it has to reject.
#
# rustls rather than native-tls because rustls, rustls-native-certs and
# rustls-pemfile were already in the graph through gpui, and the trust store
# reader goes through security-framework on macOS and openssl-probe on Linux,
# both of which it target-gates itself. This adds an adapter, not a second TLS
# stack, and no OpenSSL on any platform.
#
# `default-features = false` on rustls is load-bearing: its defaults select the
# aws-lc-rs provider, which would build a second crypto library from C and
# assembly beside the `ring` already linked in. Every crate here has to agree
# on `ring` or both get compiled.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
    "ring",
] }

# Snowflake. It publishes no Rust driver, and the community ones are tokio plus
# reqwest, so this speaks its documented SQL REST API over a blocking client --
# the same "blocking, owns no runtime GPUI has to host" rule as the three
# drivers above.
#
# Default features off for the usual reason, though here they happen to be the
# right ones: `rustls` is ureq's spelling of rustls *on ring* with webpki-roots,
# both already in the graph through `mysql`. Stated rather than inherited so a
# ureq that changes its defaults cannot bring aws-lc-rs in behind us. `gzip` is
# not optional: every result partition after the first arrives compressed.
ureq = { version = "=3.4.2", default-features = false, features = [
    "rustls",
    "gzip",
    "json",
] }
# Key-pair authentication: an RS256 signature and a SHA-256 fingerprint per
# request. Both crates were already linked, `ring` as the TLS provider. Pinned
# to the locked versions so naming them adds nothing to the build.
ring = "=0.17.14"
base64 = "=0.22.1"

# The palette's scorer. gpui-component ships the list, the virtualized scroll
# and the search field, but no fuzzy matching at all -- and ranking that reads
# as obvious (whole words, word starts, runs of adjacent characters) is not a
# few lines. This is Helix's matcher, and it pulls in memchr and nothing else.
nucleo-matcher = "=0.3.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"

# Classification only, for `sql::classify`: the mode check reads a typed
# `Statement` so it cannot mistake one statement for another. tree-sitter-sequel
# recovers `GRANT SELECT ON t TO u` as a `select` node, and a gate that reads a
# GRANT as a read is worse than no gate. It does not replace tree-sitter, which
# still finds statement boundaries in a half-typed buffer -- a strict parser
# returns `Err` and nothing else.
#
# Default features off: they pull `psm`, which builds assembly through `cc`, to
# guard against pathological nesting we do not accept from a local buffer. Off,
# it is two pure-Rust crates and an 8.5s build instead of 28.6s.
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }

# The Format Query command, and only that. A token-level reformatter: it splits
# the text into keywords, strings and comments and re-emits them with newlines,
# never building a semantic model. That is the whole reason it is here rather
# than `sqlparser`'s `{:#}` -- an AST round-trip regenerates the statement from
# the tree, which drops every comment the user wrote and silently rewrites the
# dialect corners sqlparser only half-supports. Hard rule 1 says we do not
# rewrite SQL behind the user's back, and a formatter that eats comments does.
#
# Default features off: `debug` pulls anstream, anstyle and okhsl to colourise a
# token dump nothing here prints. Off, the only crate this adds that is not
# already in the graph is `unicode_categories`; `winnow` is already here.
sqlformat = { version = "=0.5.0", default-features = false }

# Profile passwords live in the platform keychain, never in profiles.toml:
# Keychain Services on macOS, Secret Service (gnome-keyring, KWallet) on Linux.
# The `v1` default feature is the whole API this needs, and its Apple store
# writes the same generic-password items security-framework did, so passwords
# saved by an earlier build still read back.
keyring = "4"
guic-gpui-assets = "=0.2.0"
icondata_lu = "=0.1.0"
icondata_core = "=0.1.0"
# `font-kit` is not in this crate's default features, and without it the macOS
# backend swaps the text system for `NoopTextSystem` and renders no text at all
# -- silently, through a `log::warn!` nothing here is listening to.
# x11 and wayland: gpui-pre-platform enables neither by default, and the Linux
# backend panics on the first frame unless at least one is on. Both are inert
# in a macOS build -- they forward to gpui_linux, which is not in that graph.
gpui_platform = { version = "=0.3.5", package = "gpui-pre-platform", features = [
    "font-kit",
    "x11",
    "wayland",
] }

# GPUI does layout, text shaping and scene building on the CPU every frame, so
# an unoptimized gpui drops frames the moment a grid scrolls. Dependencies are
# compiled optimized even in dev; DBDelve's own crate stays at opt-level 0, so
# incremental builds and debugging are unaffected once deps are built.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
