name: release

# Run from the Actions tab. Unticked, it builds every asset, signs them and
# publishes nothing -- the point is finding out whether they build and whether
# the signing key is the one the app trusts. Ticked, it tags the
# commit as v<Cargo.toml version>, publishes the release once every asset
# exists, and repoints the Homebrew cask. A version with a hyphen
# (0.2.0-rc.1) is published as a pre-release, may come from any branch, and
# leaves the cask alone.
#
# The nightly channel builds DBDelve Nightly, a separate app, from main: every
# day on the schedule, or from the Actions tab with channel set to nightly. Its
# version is Cargo.toml's with the patch bumped, then -nightly.<UTC
# date>.<run number>, so it never needs a bump. A scheduled run publishes, and
# skips itself when main has not moved since the last nightly. Each nightly is
# a pre-release, repoints the dbdelve@nightly cask, and the oldest beyond the
# newest 14 are deleted with their tags.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (unticked builds only)
        type: boolean
        default: false
      channel:
        description: Stable is Cargo.toml's version; nightly is DBDelve Nightly
        type: choice
        options: [stable, nightly]
        default: stable

# Only the job that publishes needs the token; it asks for its own write.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Reads the releases to find the last nightly.
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      build: ${{ steps.version.outputs.build }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before any build, so a release that cannot go out fails in seconds
      # instead of after every asset has been built.
      - id: version
        run: |
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # A scheduled run has no inputs, and is always a nightly that
          # publishes.
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            CHANNEL=nightly
            PUBLISH=true
          fi
          BUILD=true
          PREVIOUS=
          if [[ "$CHANNEL" == nightly ]]; then
            if [[ ! "$CARGO_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "a nightly bumps the patch of a plain x.y.z, and Cargo.toml has $CARGO_VERSION" >&2
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-nightly.$(date -u +%Y%m%d).$RUN_NUMBER"
            PRERELEASE=true
            # The same page and the same tag shape the nightly updater reads,
            # and sort -V orders them as it does: version, then date, then run.
            PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '.[].tag_name' |
              { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
            if [[ "$GITHUB_EVENT_NAME" == schedule && -n "$PREVIOUS" ]]; then
              BUILT_FROM="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PREVIOUS" --jq .sha)"
              if [[ "$BUILT_FROM" == "$GITHUB_SHA" ]]; then
                echo "::notice::$PREVIOUS was built from $GITHUB_SHA, which main is still at -- nothing to release"
                BUILD=false
              fi
            fi
          else
            VERSION="$CARGO_VERSION"
            PRERELEASE=false
            [[ "$VERSION" == *-* ]] && PRERELEASE=true
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "publish=$PUBLISH"
            echo "build=$BUILD"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"
          [[ "$BUILD" == true && "$PUBLISH" == true ]] || exit 0
          # An existing tag means Cargo.toml was not bumped since the last
          # release, and publishing would reuse a tag on a different commit.
          if [[ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]]; then
            if [[ "$CHANNEL" == nightly ]]; then
              echo "v$VERSION is already tagged" >&2
            else
              echo "v$VERSION is already tagged -- bump the version in Cargo.toml" >&2
            fi
            exit 1
          fi
          if [[ "$CHANNEL" == nightly && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "a nightly is built from main -- publish it from there" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == false && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "$VERSION is a stable version -- publish it from main" >&2
            exit 1
          fi
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        # 22.04, never ubuntu-latest: glibc is forward-compatible only, so a
        # binary linked against a newer runner's glibc will not start on Ubuntu
        # 22.04 or on Debian stable. The oldest runner we build on is the
        # oldest system the release runs on.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binary reads both at compile time, and the packaging scripts name
      # the nightly's assets from them. Stable sets neither.
      - if: needs.version.outputs.channel == 'nightly'
        run: |
          echo "DBDELVE_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "DBDELVE_VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # The same list the README tells a Linux user to install before building
      # from source, plus unixodbc-dev for the ODBC bridge to link against.
      # If CI needs something more, the README is wrong too.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev unixodbc-dev

      # Builds the ODBC bridge too (`cargo build --release -p
      # dbdelve-plugin-odbc`, through dev/plugins.sh) and puts it beside the
      # binary.
      - run: dev/package-linux.sh

      # Second, not instead: the tarball installs a desktop entry and icons,
      # the AppImage is one file that runs without installing anything, and
      # the release carries both. Both come off the same `cargo build
      # --release`, so this one is the packaging step alone.
      - run: dev/package-appimage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.runner }}
          path: |
            target/linux/dbdelve-*.tar.gz
            target/linux/dbdelve-*.AppImage
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    # arm64, which is all the cask installs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.version.outputs.channel == 'nightly'
        run: |
          echo "DBDELVE_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "DBDELVE_VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # bundle.sh also builds the ODBC bridge; unixODBC compiles from source
      # into it with the runner's C compiler, so nothing is installed here.
      # Ad-hoc, deliberately: a Developer ID is the only identity Gatekeeper
      # would trust, and a signature from an issuer the user does not trust
      # reads worse than an anonymous one. The price is that the hash moves
      # every release, so the Keychain asks once more after each update.
      - run: dev/bundle.sh
        env:
          DBDELVE_CHANNEL: ${{ needs.version.outputs.channel == 'nightly' && 'nightly' || 'release' }}
          DBDELVE_SIGN_ID: "-"

      # A symlink beside the app is the whole of the drag-to-install convention.
      - run: |
          if [[ "$CHANNEL" == nightly ]]; then
            NAME="DBDelve Nightly"
            APP="target/macos-nightly/DBDelve Nightly.app"
            DMG="target/DBDelve-Nightly-$VERSION.dmg"
          else
            NAME=DBDelve
            APP=target/DBDelve.app
            DMG="target/DBDelve-$VERSION.dmg"
          fi
          mkdir -p target/dmg
          cp -R "$APP" target/dmg/
          ln -s /Applications target/dmg/Applications
          # hdiutil's own estimate from -srcfolder came up short once the
          # binary grew; it only sizes the scratch image, not the compressed DMG.
          SIZE_MB=$(( $(du -sm target/dmg | cut -f1) * 2 + 50 ))
          hdiutil create -volname "$NAME $VERSION" -srcfolder target/dmg \
            -size "${SIZE_MB}m" -ov -format UDZO "$DMG"
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: target/DBDelve-*.dmg
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.version.outputs.channel == 'nightly'
        shell: bash
        run: |
          echo "DBDELVE_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "DBDELVE_VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # The hosted image already has MSVC, the Windows SDK (GPUI's shaders)
      # and rc.exe (the icon resource). Inno Setup is only for wrapping the
      # staged tree into the installer; the app itself does not need it, so
      # it is not a README build dependency. The ODBC bridge builds here
      # against the system's odbc32, and is packaged without ever being run.
      - run: choco install innosetup --no-progress --yes
      - run: powershell -File dev/package-windows.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/windows/dbdelve-*.zip
            target/windows/dbdelve-*-setup.exe
          if-no-files-found: error

  # Its own job, and not gated on publishing, so an unticked run proves the
  # secret signs what the app will accept before a release depends on it.
  sign:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Every asset gets a minisign signature beside it, `<asset>.minisig`,
      # which is what the app checks an update against before installing it.
      # All of them, not only the DMG, so the other platforms' updaters need
      # nothing new here. UPDATE_SIGNING_KEY is an unencrypted minisign secret
      # key; without it nothing is published, since a release without
      # signatures is one no installed app will update to.
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "the UPDATE_SIGNING_KEY secret is not set -- releases must be signed" >&2
            exit 1
          fi
          # The key the app is built with, so a secret that does not match it
          # fails here instead of in every installed app.
          PUBLIC_KEY="$(sed -n 's/^const RELEASE_PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/update/download.rs)"
          if ! grep -qxF "PUBLIC_KEY=\"$PUBLIC_KEY\"" install.sh; then
            echo "install.sh does not check downloads against the app's release key" >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/update.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY"
          for ASSET in dist/*; do
            minisign -S -s "$KEY" -m "$ASSET" -x "$ASSET.minisig" < /dev/null
            # The app verifies prehashed signatures only (algorithm "ED");
            # a minisign old enough to make the legacy kind must fail here.
            if [[ "$(sed -n 2p "$ASSET.minisig" | base64 -d | head -c 2)" != ED ]]; then
              echo "$ASSET.minisig is not a prehashed signature" >&2
              exit 1
            fi
            # The app requires the trusted comment, which the signature covers,
            # to name the asset it downloaded: minisign's default
            # `file:<basename>` is what binds a signature to one release.
            if [[ "$(sed -n 3p "$ASSET.minisig")"$'\t' != *$'\t'"file:${ASSET##*/}"$'\t'* ]]; then
              echo "$ASSET.minisig does not name ${ASSET##*/} in its trusted comment" >&2
              exit 1
            fi
            minisign -V -q -P "$PUBLIC_KEY" -m "$ASSET" -x "$ASSET.minisig"
          done
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: dist/*.minisig
          if-no-files-found: error

  release:
    needs: [version, sign]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Every file the release is supposed to carry is named here, so a build
      # that quietly lost one fails before anything goes public rather than
      # publishing a release that is missing it.
      - run: |
          if [[ "$CHANNEL" == nightly ]]; then
            DMG="DBDelve-Nightly-$VERSION.dmg"
            SLUG=dbdelve-nightly
            TITLE="DBDelve Nightly $VERSION"
          else
            DMG="DBDelve-$VERSION.dmg"
            SLUG=dbdelve
            TITLE="DBDelve $VERSION"
          fi
          for ASSET in "$DMG" \
            "$SLUG-$VERSION-linux-x86_64.tar.gz" "$SLUG-$VERSION-x86_64.AppImage" \
            "$SLUG-$VERSION-linux-aarch64.tar.gz" "$SLUG-$VERSION-aarch64.AppImage" \
            "$SLUG-$VERSION-windows-x86_64.zip" \
            "$SLUG-$VERSION-windows-x86_64-setup.exe"; do
            for FILE in "$ASSET" "$ASSET.minisig"; do
              if [[ ! -f "dist/$FILE" ]]; then
                echo "no $FILE among the built assets" >&2
                ls dist >&2
                exit 1
              fi
            done
          done
          FLAGS=()
          [[ "$PRERELEASE" == true ]] && FLAGS+=(--prerelease)
          # A nightly's notes cover what changed since the last nightly, not
          # since the last stable release.
          [[ "$CHANNEL" == nightly && -n "$PREVIOUS" ]] && FLAGS+=(--notes-start-tag "$PREVIOUS")
          # --target creates the tag on the commit that was built. A tag made
          # with github.token starts no other workflow run.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "$TITLE" --generate-notes "${FLAGS[@]}" \
            --notes "Missing something? [Request it or upvote others' ideas](https://github.com/ShayanAbbas1/dbdelve/discussions/42)."
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PREVIOUS: ${{ needs.version.outputs.previous }}

  cask:
    needs: [version, release]
    # A stable pre-release is for testing the pipeline, and Homebrew users
    # would get it as an ordinary update. A nightly has a cask of its own.
    if: needs.version.outputs.channel == 'nightly' || needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos

      # TAP_TOKEN is a fine-grained PAT with contents: write on the tap alone.
      # github.token cannot push to another repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ShayanAbbas1/homebrew-dbdelve
          token: ${{ secrets.TAP_TOKEN }}
          # The next step pushes to the tap, so the token has to stay persisted.
          persist-credentials: true
          path: tap

      - if: needs.version.outputs.channel != 'nightly'
        run: |
          SHA="$(sha256sum "DBDelve-$VERSION.dmg" | cut -d' ' -f1)"
          mkdir -p tap/Casks
          # Rewritten whole rather than patched in place: two substitutions that
          # have to agree are two chances for the version and the checksum to
          # drift apart.
          cat > tap/Casks/dbdelve.rb <<CASK
          cask "dbdelve" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/ShayanAbbas1/dbdelve/releases/download/v#{version}/DBDelve-#{version}.dmg"
            name "DBDelve"
            desc "Fast, native, multi-engine database client"
            homepage "https://github.com/ShayanAbbas1/dbdelve"

            # The app updates itself, so Homebrew leaves upgrading it to the app.
            auto_updates true
            depends_on arch: :arm64
            depends_on macos: :monterey

            app "DBDelve.app"

            # Ad-hoc signed and not notarized, so Gatekeeper refuses the app
            # until its quarantine flag is cleared. Done here so a Homebrew
            # install opens without the xattr command a manual one needs.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/DBDelve.app"]
            end

            # Lowercase: the app writes "dbdelve", and a zap spelled any other way
            # silently removes nothing. Saved passwords live in the Keychain, which zap
            # cannot reach at all.
            zap trash: "~/Library/Application Support/dbdelve"
          end
          CASK
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dbdelve.rb
          git commit -m "DBDelve $VERSION"
          git push
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # Stable's cask with Nightly's app, DMG and directories. The @ name is
      # Homebrew's for another channel of the same app, and installs beside it.
      - if: needs.version.outputs.channel == 'nightly'
        run: |
          SHA="$(sha256sum "DBDelve-Nightly-$VERSION.dmg" | cut -d' ' -f1)"
          mkdir -p tap/Casks
          cat > tap/Casks/dbdelve@nightly.rb <<CASK
          cask "dbdelve@nightly" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/ShayanAbbas1/dbdelve/releases/download/v#{version}/DBDelve-Nightly-#{version}.dmg"
            name "DBDelve Nightly"
            desc "Fast, native, multi-engine database client"
            homepage "https://github.com/ShayanAbbas1/dbdelve"

            auto_updates true
            depends_on arch: :arm64
            depends_on macos: :monterey

            app "DBDelve Nightly.app"

            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/DBDelve Nightly.app"]
            end

            zap trash: [
              "~/Library/Application Support/dbdelve-nightly",
              "~/Library/Logs/dbdelve-nightly",
            ]
          end
          CASK
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dbdelve@nightly.rb
          git commit -m "DBDelve Nightly $VERSION"
          git push
        env:
          VERSION: ${{ needs.version.outputs.version }}

  # Nightlies are not kept: the newest 14 stay, and older ones go with their
  # tags. Only nightly tags are matched, so a stable release is never touched.
  prune:
    needs: [version, release]
    if: needs.version.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    # Deletes releases and their tags.
    permissions:
      contents: write
    steps:
      - run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+\.[0-9]+$' || true; } |
            sort -rV | tail -n +15 |
            while read -r TAG; do
              echo "deleting $TAG"
              gh release delete "$TAG" --cleanup-tag --yes
            done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
