version: 2
# Actions only. Cargo dependencies are pinned exactly on purpose and move only
# when someone decides to move them.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually taken down within days, so hold updates
    # for a week. Seven days is zizmor's minimum.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
