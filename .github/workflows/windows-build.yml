name: windows-build

on:
  pull_request:
    paths:
      - "src/**"
      - "build.rs"
      - "build/**"
      - "assets/linux/icons/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
