name: update-e2e-windows

# The Windows self-update end to end: dev/update-e2e-windows.ps1 builds this
# version and a 99.0.0 with update-test-hooks, signs the newer one with a key
# made for the run, and has the older app update itself from a feed on
# 127.0.0.1. No repository secret is involved, so it runs from any branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/update/**"
      - "src/update.rs"
      - "assets/windows/**"
      - "dev/package-windows.ps1"
      - "dev/update-e2e-windows.ps1"
      - "dev/update-test-kit/**"
      - ".github/workflows/update-e2e-windows.yml"

permissions:
  contents: read

concurrency:
  group: update-e2e-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The update path does not care how the binary was optimised; two release
# builds with the shipped thin LTO and one codegen unit are most of an hour.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A key of its own: ci.yml's Windows cache is a dev-profile build.
      - name: rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: update-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Why: ci.yml's `drop cached duckdb sources`.
      - name: drop cached duckdb sources
        shell: bash
        run: rm -rf target/duckdb-sources
      - name: inno setup
        run: choco install innosetup --no-progress --yes
      - name: update end to end
        run: pwsh -NoProfile -File dev/update-e2e-windows.ps1 -Work "$env:RUNNER_TEMP\update-e2e" -Kit "$env:RUNNER_TEMP\update-test-kit"
        shell: pwsh
      # For testing by hand what CI cannot: the click, the UAC prompt, the
      # unelevated reopen (dev/update-test-kit/README.txt). Present only when
      # it was built and its server checked out, failing scenarios or not.
      - name: test kit
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-kit-windows
          path: ${{ runner.temp }}/update-test-kit
          if-no-files-found: ignore
          retention-days: 3
      - name: diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-diagnostics
          path: ${{ runner.temp }}/update-e2e/diagnostics
          if-no-files-found: ignore
