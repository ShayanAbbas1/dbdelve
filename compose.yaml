services:
  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: dbdelve_dev
      POSTGRES_USER: dbdelve
      POSTGRES_PASSWORD: dbdelve
    ports:
      - "${DBDELVE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - dbdelve-postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbdelve -d dbdelve_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbdelve_dev
      MYSQL_USER: dbdelve
      MYSQL_PASSWORD: dbdelve
      MYSQL_ROOT_PASSWORD: dbdelve
    ports:
      - "${DBDELVE_MYSQL_PORT:-53306}:3306"
    volumes:
      - dbdelve-mysql-data:/var/lib/mysql
      - ./dev/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdbdelve"]
      interval: 2s
      timeout: 3s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: DbDelve_MssqlSA1!
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "${DBDELVE_MSSQL_PORT:-51433}:1433"
    volumes:
      - dbdelve-mssql-data:/var/opt/mssql
      - ./dev/mssql/init:/dbdelve-init:ro
      - ./dev/mssql/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Proves the seed applied (a row count as the app login), not just that
      # the server answers: the same MySQL "healthy but half-seeded" trap.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U dbdelve -P DBDelve_dev1 -d dbdelve_dev -b -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.accounts;'"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  dbdelve-postgres-data:
  dbdelve-mysql-data:
  dbdelve-mssql-data:
