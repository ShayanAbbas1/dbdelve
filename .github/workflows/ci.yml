name: ci

# The push to main is what gives a new PR a cache to start from: a PR can only
# restore caches saved by itself or by the default branch, so without it every
# PR's first run compiled every dependency from scratch.
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".github/workflows/ci.yml"

# Only main saves: the repository gets 10 GB of cache, and every job on every
# branch saving its own 0.5-2 GB copy evicted main's within the hour, so most
# runs started cold. PRs still restore main's.
#
# The vendored crates under vendor/ rebuild on every run whatever the cache
# holds: cargo judges a path crate fresh by file mtimes, and a checkout gives
# every file a new one. Only a non-path source (a git dependency) avoids that.
# Nothing here pushes or comments; build scripts and proc macros from a PR run
# with whatever token the job holds.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          # The runner image ships Microsoft's apt repository, which we install
          # nothing from; when it errors (403s, lapsed signatures) it fails
          # the whole update.
          { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  tests:
    # Not 22.04: its sqlite3 (3.37) predates unhex(), which the dev seed uses.
    runs-on: ubuntu-24.04
    env:
      # insta lets either variable rewrite or force-pass a snapshot, and CI must
      # fail on any difference instead.
      INSTA_UPDATE: "no"
      INSTA_FORCE_PASS: "0"
      PGHOST: 127.0.0.1
      PGPORT: "55432"
      PGDATABASE: dbdelve_dev
      PGUSER: dbdelve
      PGPASSWORD: dbdelve
      # Lowercase prefix on purpose: it is what the live_ tests read.
      dbdelve_MYSQL_URL: mysql://dbdelve:dbdelve@127.0.0.1:53306/dbdelve_dev
      dbdelve_MARIADB_URL: mariadb://dbdelve:dbdelve@127.0.0.1:53307/dbdelve_dev
      dbdelve_MSSQL_URL: mssql://dbdelve:DBDelve_dev1@127.0.0.1:51433/dbdelve_dev
      dbdelve_MONGO_URL: mongodb://dbdelve:dbdelve@127.0.0.1:57017/dbdelve_dev
      dbdelve_REDIS_URL: redis://dbdelve:dbdelve@127.0.0.1:56379/0
      dbdelve_CLICKHOUSE_URL: clickhouse://dbdelve:dbdelve@127.0.0.1:58123/dbdelve_dev?sslmode=disable
      dbdelve_SQLITE_PATH: ${{ github.workspace }}/dev/dbdelve_dev.db
      # For the live_ssh_ tests a later checkpoint adds; setup.sh writes this.
      dbdelve_SSH_CONFIG: ${{ github.workspace }}/dev/ssh/.generated/ssh_config
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Started before the apt step so the databases boot while it runs.
      - run: docker compose up -d
      - run: |
          # The runner image ships Microsoft's apt repository, which we install
          # nothing from; when it errors (403s, lapsed signatures) it fails
          # the whole update.
          { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev sqlite3 \
            mesa-vulkan-drivers libvulkan1 libegl1 libgles2 libgl1-mesa-dri
      - run: sqlite3 dev/dbdelve_dev.db < dev/sqlite/001-dbdelve-demo.sql
      - run: dev/ssh/setup.sh
      - run: docker compose up -d --wait
      # CI has no Snowflake account, and the live Snowflake tests panic
      # without one; the mock tests cover the same ground offline. The one
      # live test that needs no account stays: it is what proves the TLS
      # provider is linked at run time.
      - run: cargo test -- --include-ignored --skip snowflake::tests::live_ --skip turso::tests::live_ --skip reads_run_at_once --skip conformance
      # These time two reads run at once against the same two in turn. With
      # the rest of the suite sharing the runner's cores, a CPU-bound engine
      # like SQLite misses the margin by chance, so they run alone.
      - run: cargo test reads_run_at_once -- --include-ignored --skip snowflake::tests::live_ --skip turso::tests::live_ --test-threads=1
      # Own step: each DuckDB subject seeds a 1M-row table, which would add contention to the timing assertions above.
      - run: cargo test live_conformance -- --include-ignored --skip turso::tests::live_ --test-threads=4
      - run: cargo test snowflake::tests::live_an_account_that_does_not_exist -- --ignored
      # The backdrop blur's pixel tests live in the vendored wgpu renderer,
      # which isn't a workspace member, so `cargo test` alone never runs them.
      # Mesa's lavapipe (Vulkan) and llvmpipe (GL) give the runner a software
      # adapter. One thread: each test builds its own device.
      - run: cargo test -p gpui-pre-wgpu --features test-support -- --test-threads=1

  macos-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build

  windows-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  # Tests too, not only the build: the storage tests are what exercise the
  # APPDATA paths, and no other job runs them on Windows.
  windows-build:
    runs-on: windows-latest
    env:
      # insta lets either variable rewrite or force-pass a snapshot, and CI must
      # fail on any difference instead.
      INSTA_UPDATE: "no"
      INSTA_FORCE_PASS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build
      - run: cargo test
      # The backdrop blur's Direct3D WARP pixel tests live in the vendored
      # DirectX renderer, which isn't a workspace member, so `cargo test` alone
      # never runs them. Release, because only release builds use the shaders
      # fxc compiles in build.rs, which is what ships. Thin LTO and one codegen
      # unit are the shipped profile's settings; here they only slow a separate
      # build of every dependency and bloat the cache.
      - run: cargo test --release -p gpui-pre-windows --lib directx_renderer::backdrop_tests -- --test-threads=1
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
