name: Bug report
description: Something in DBDelve doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Which databases it happens with.
      multiple: true
      options:
        - Not specific to one
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - DuckDB
        - Turso
        - Snowflake
        - SQL Server
        - MongoDB
        - Redis
        - ClickHouse
        - ODBC plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DBDelve version and OS
      placeholder: DBDelve 0.7.0 on macOS 15.1, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Use **Help → Copy Diagnostics** (or Copy diagnostics in the command palette) and paste here. It copies the version, OS, plugins and the end of today's log.

        Or attach the log file. **Help → Open Logs Folder** opens the folder, or find it at:
        - macOS: `~/Library/Logs/dbdelve/`
        - Linux: `$XDG_STATE_HOME/dbdelve/`, or `~/.local/state/dbdelve/`
        - Windows: `%LOCALAPPDATA%\dbdelve\`

        If the default log doesn't show the problem, turn on **Verbose logging** in Settings, reproduce it, and copy again. The log never holds queries, rows or passwords, but a verbose one includes hostnames, database names and error text from the server, so read it before you post.
