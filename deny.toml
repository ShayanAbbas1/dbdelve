[advisories]
# Each one is against rustls 0.21 / rustls-webpki 0.101, which only tiberius
# 0.12 (SQL Server) pulls in, and goes with the tiberius 0.13 upgrade. Pinned
# like every driver, so these are tolerated until then rather than bumped past.
ignore = [
    # rustls 0.21 parses CRLs only to verify client certificates on a server,
    # and tiberius is a TLS client.
    { id = "RUSTSEC-2026-0104", reason = "CRLs are parsed only server-side; tiberius is a client" },
    { id = "RUSTSEC-2026-0346", reason = "nothing Debug-formats a tiberius TLS session" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 has no post-quantum key exchange to downgrade from" },
    { id = "RUSTSEC-2026-0098", reason = "name constraints: low severity, tolerated until tiberius 0.13" },
    { id = "RUSTSEC-2026-0099", reason = "name constraints: low severity, tolerated until tiberius 0.13" },
]

[licenses]
# The permissive licenses the graph holds today. A crate bringing in another
# fails here until someone decides about it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Copyleft is admitted crate by crate, never by license.
exceptions = [
    { crate = "dbdelve", allow = ["GPL-3.0-only"] },
    # The fonts the app embeds.
    { crate = "guic-gpui-assets", allow = ["OFL-1.1"] },
    # MPL-2.0's copyleft covers only the crate's own files, if changed.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    { crate = "dwrote", allow = ["MPL-2.0"] },
    { crate = "nucleo-matcher", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
# The GPUI graph carries several versions of many crates: reported, not failed.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
