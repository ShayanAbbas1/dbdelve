name: ci

# The push to main is what gives a new PR a cache to start from: a PR can only
# restore caches saved by itself or by the default branch, so without it every
# PR's first run compiled every dependency from scratch.
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".config/nextest.toml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".config/nextest.toml"
      - ".github/workflows/ci.yml"

# Only main saves: the repository gets 10 GB of cache, and every job on every
# branch saving its own 0.5-2 GB copy evicted main's within the hour, so most
# runs started cold. PRs still restore main's.
#
# The vendored crates under vendor/ rebuild on every run whatever the cache
# holds: cargo judges a path crate fresh by file mtimes, and a checkout gives
# every file a new one. Only a non-path source (a git dependency) avoids that.
# Nothing here pushes or comments; build scripts and proc macros from a PR run
# with whatever token the job holds.
permissions:
  contents: read

# Cargo.toml compiles dependencies at opt-level 3 so the dev app keeps its frame
# rate; CI draws no frames, and those optimized, debuginfo-laden builds are most
# of a cold run's hour and of each job's cache. No environment variable reaches
# `[profile.dev.package."*"]`, so every job writes that override into a
# .cargo/config.toml above the checkout (macOS runners have no ~/.cargo); Cargo
# reads config from parent directories, and it takes precedence over the
# manifest. rust-cache keys on CARGO_* variables but not on that file: change
# the override and the variable below together, or main keeps restoring caches
# built the old way.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  # insta lets either variable rewrite or force-pass a snapshot, and CI must
  # fail on any difference instead.
  INSTA_UPDATE: "no"
  INSTA_FORCE_PASS: "0"

# Not on main: a run there cancelled by the next merge never reaches
# rust-cache's save, and the slowest job is the one that loses it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One job per platform, so each saves one cache. No `cargo build` step:
# `cargo test` compiles and links the crate, clippy checks what only the app
# builds, and the release workflow builds the binary that ships.
jobs:
  linux:
    # Not 22.04: its sqlite3 (3.37) predates unhex(), which the dev seed uses.
    runs-on: ubuntu-24.04
    env:
      NEXTEST_PROFILE: ci
      PGHOST: 127.0.0.1
      PGPORT: "55432"
      PGDATABASE: dbdelve_dev
      PGUSER: dbdelve
      PGPASSWORD: dbdelve
      # Lowercase prefix on purpose: it is what the live_ tests read.
      dbdelve_MYSQL_URL: mysql://dbdelve:dbdelve@127.0.0.1:53306/dbdelve_dev
      dbdelve_MARIADB_URL: mariadb://dbdelve:dbdelve@127.0.0.1:53307/dbdelve_dev
      dbdelve_MSSQL_URL: mssql://dbdelve:DBDelve_dev1@127.0.0.1:51433/dbdelve_dev
      dbdelve_MONGO_URL: mongodb://dbdelve:dbdelve@127.0.0.1:57017/dbdelve_dev
      dbdelve_REDIS_URL: redis://dbdelve:dbdelve@127.0.0.1:56379/0
      dbdelve_CLICKHOUSE_URL: clickhouse://dbdelve:dbdelve@127.0.0.1:58123/dbdelve_dev?sslmode=disable
      dbdelve_SQLITE_PATH: ${{ github.workspace }}/dev/dbdelve_dev.db
      # For the live_ssh_ tests; dev/ssh/setup.sh writes it.
      dbdelve_SSH_CONFIG: ${{ github.workspace }}/dev/ssh/.generated/ssh_config
    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # First, so the databases boot while everything else runs.
      - name: start databases
        run: docker compose up -d
      - name: fmt
        run: cargo fmt --check
      - name: system packages
        run: |
          # The runner image ships Microsoft's apt repository, which we install
          # nothing from; when it errors (403s, lapsed signatures) it fails
          # the whole update.
          { grep -rl packages.microsoft.com /etc/apt/sources.list.d || true; } | xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev sqlite3 \
            mesa-vulkan-drivers libvulkan1 libegl1 libgles2 libgl1-mesa-dri
      # Before rust-cache, which saves only the binaries that appear after it
      # runs: the prebuilt download is quicker than carrying it in the cache.
      - name: install nextest
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-nextest@0.9.150
      - &rust-cache
        name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/per-os-jobs' }}
      - &dependencies-unoptimized
        name: dependencies unoptimized
        run: mkdir -p ../.cargo && printf '[profile.dev.package."*"]\nopt-level = 0\n' >> ../.cargo/config.toml
        shell: bash
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: seed databases
        run: |
          sqlite3 dev/dbdelve_dev.db < dev/sqlite/001-dbdelve-demo.sql
          dev/ssh/setup.sh
          docker compose up -d --wait
      # nextest for the retries .config/nextest.toml gives the live tests. Its
      # test() matches any part of a name, as cargo test's filters do. CI has
      # no Snowflake account, and the live Snowflake tests panic without one;
      # the mock tests cover the same ground offline.
      - name: test
        run: >-
          cargo nextest run --run-ignored all -E 'not (test(snowflake::tests::live_)
          | test(turso::tests::live_) | test(reads_run_at_once) | test(conformance))'
      # These time two reads run at once against the same two in turn. With
      # the rest of the suite sharing the runner's cores, a CPU-bound engine
      # like SQLite misses the margin by chance, so they run alone.
      - name: timing tests
        run: >-
          cargo nextest run --run-ignored all --test-threads 1 -E 'test(reads_run_at_once)
          - test(snowflake::tests::live_) - test(turso::tests::live_)'
      # Own step: each DuckDB subject seeds a 1M-row table, which would add
      # contention to the timing assertions above.
      - name: conformance
        run: >-
          cargo nextest run --run-ignored all --test-threads 4
          -E 'test(live_conformance) - test(turso::tests::live_)'
      # The one live Snowflake test that needs no account: it is what proves
      # the TLS provider is linked at run time.
      - name: snowflake tls
        run: >-
          cargo nextest run --run-ignored only
          -E 'test(snowflake::tests::live_an_account_that_does_not_exist)'
      # The pixel tests check the vendored renderers, so a PR runs them only
      # when it changes vendor/; a push to main always does, which catches
      # anything else that moves their output, a dependency bump among them. A
      # PR's checkout is its merge commit, so the diff against the base is
      # exactly what the PR changes.
      - &vendor-changed
        name: vendor changed
        id: vendor
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [[ -n "$BASE" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            git diff --quiet "$BASE" HEAD -- vendor/ && changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # The backdrop blur's pixel tests live in the vendored wgpu renderer,
      # which isn't a default workspace member, so `cargo test` alone never
      # runs them. Mesa's lavapipe (Vulkan) and llvmpipe (GL) give the runner a
      # software adapter. One thread: each test builds its own device.
      - name: pixel tests
        if: steps.vendor.outputs.changed == 'true'
        run: cargo test -p gpui-pre-wgpu --features test-support -- --test-threads=1

  # macOS runners have no Docker, so the live tests run on Linux alone.
  macos:
    runs-on: macos-latest
    steps:
      - *checkout
      - *rust-cache
      - *dependencies-unoptimized
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - *checkout
      - *rust-cache
      - *dependencies-unoptimized
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # The storage tests are what exercise the APPDATA paths.
      - name: test
        run: cargo test
      - *vendor-changed
      # The backdrop blur's Direct3D WARP pixel tests live in the vendored
      # DirectX renderer, which isn't a workspace member, so `cargo test` alone
      # never runs them. Release, because only release builds use the shaders
      # fxc compiles in build.rs, which is what ships. Thin LTO and one codegen
      # unit are the shipped profile's settings; here they only slow a separate
      # build of every dependency and bloat the cache.
      - name: pixel tests
        if: steps.vendor.outputs.changed == 'true'
        run: cargo test --release -p gpui-pre-windows --lib directx_renderer::backdrop_tests -- --test-threads=1
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
